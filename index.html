<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1B2A4A" />
<title>100일 나침반 진단</title>

<!-- Pretendard -->
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
  :root {
    --navy: #1B2A4A;
    --teal: #1A8F6A;
    --teal-light: #E8F5EF;
    --teal-dark: #116E50;
    --gold: #C8A951;
    --white: #FFFFFF;
    --bg: #F8F9FA;
    --bg-card: #FFFFFF;
    --text-primary: #1B2A4A;
    --text-secondary: #5A6B7D;
    --text-muted: #8E9BAA;
    --border: #E2E8F0;
    --success: #22C55E;
    --warning: #F59E0B;
    --danger: #EF4444;
    --gradient-premium: linear-gradient(135deg, #1B2A4A 0%, #1A8F6A 100%);
    --gradient-soft: linear-gradient(180deg, #FFFFFF 0%, #E8F5EF 100%);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Pretendard Variable', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* Progress bar (top fixed) */
  #progress-wrap {
    position: fixed; top: 0; left: 0; right: 0;
    height: 4px; background: var(--border);
    z-index: 100; transition: opacity .25s;
  }
  #progress-bar {
    height: 100%; background: var(--teal);
    width: 0%; transition: width .35s cubic-bezier(.22,1,.36,1);
  }

  /* App container */
  #app {
    max-width: 640px; margin: 0 auto; padding: 32px 20px 80px;
    min-height: 100vh;
  }

  /* Intro screen */
  .intro {
    padding: 48px 8px; text-align: center;
  }
  .intro h1 {
    font-size: 28px; font-weight: 800; color: var(--navy);
    margin: 0 0 8px; letter-spacing: -0.02em;
  }
  .intro .subtitle {
    font-size: 15px; color: var(--text-secondary); margin: 0 0 36px;
  }
  .intro .card {
    background: var(--bg-card); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 2px 12px rgba(27,42,74,.06);
    text-align: left; margin-bottom: 24px;
  }
  .intro .card h3 {
    font-size: 16px; font-weight: 700; color: var(--navy);
    margin: 0 0 16px; display: flex; align-items: center; gap: 8px;
  }
  .intro .card ul {
    list-style: none; margin: 0; padding: 0;
    font-size: 14px; color: var(--text-secondary);
  }
  .intro .card li {
    padding: 6px 0; display: flex; gap: 10px;
  }
  .intro .card li::before {
    content: "·"; color: var(--teal); font-weight: 800;
    flex-shrink: 0; width: 8px;
  }

  .input-name {
    width: 100%; height: 52px; padding: 0 16px;
    border: 2px solid var(--border); border-radius: 12px;
    font-size: 16px; font-family: inherit; color: var(--text-primary);
    background: var(--white); margin-bottom: 16px;
    transition: border-color .2s;
  }
  .input-name:focus {
    outline: none; border-color: var(--teal);
  }

  /* Question card */
  .qcard {
    background: var(--bg-card); border-radius: 16px;
    padding: 28px 24px; box-shadow: 0 2px 12px rgba(27,42,74,.06);
    margin-bottom: 24px; animation: fadeIn .3s ease;
  }
  .qmeta {
    font-size: 12px; font-weight: 600; color: var(--teal);
    letter-spacing: 0.05em; margin-bottom: 10px;
    text-transform: uppercase;
  }
  .qtext {
    font-size: 19px; font-weight: 700; color: var(--navy);
    line-height: 1.45; margin: 0 0 24px; letter-spacing: -0.01em;
  }
  .qtext.small {
    font-size: 16px; font-weight: 600;
  }

  /* Option buttons */
  .opts { display: flex; flex-direction: column; gap: 10px; }
  .opt {
    display: block; width: 100%; text-align: left;
    padding: 16px 18px; border: 2px solid var(--border);
    border-radius: 12px; background: var(--white);
    font-size: 15px; font-weight: 500; line-height: 1.45;
    color: var(--text-primary); cursor: pointer;
    font-family: inherit; transition: all .15s ease;
  }
  .opt:hover { background: var(--teal-light); border-color: var(--teal); }
  .opt.selected {
    background: var(--teal); border-color: var(--teal); color: var(--white);
  }

  /* Slider */
  .slider-wrap { padding: 16px 4px 0; }
  .slider-labels {
    display: flex; justify-content: space-between; gap: 16px;
    font-size: 13px; color: var(--text-secondary);
    margin-bottom: 20px; line-height: 1.4;
  }
  .slider-labels span { flex: 1; }
  .slider-labels .left { text-align: left; }
  .slider-labels .right { text-align: right; }
  .slider-label-quote { font-weight: 600; color: var(--navy); }

  .slider {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 6px; border-radius: 8px;
    background: linear-gradient(90deg, var(--teal) var(--pct,50%), var(--border) var(--pct,50%));
    outline: none;
  }
  .slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--navy); cursor: pointer;
    border: 3px solid var(--white);
    box-shadow: 0 2px 8px rgba(27,42,74,.25);
  }
  .slider::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--navy); cursor: pointer;
    border: 3px solid var(--white);
    box-shadow: 0 2px 8px rgba(27,42,74,.25);
  }
  .slider-value {
    text-align: center; margin-top: 18px;
    font-size: 14px; color: var(--text-secondary);
  }
  .slider-ticks {
    display: flex; justify-content: space-between;
    padding: 8px 10px 0;
    font-size: 11px; color: var(--text-muted);
    font-family: 'DM Mono', monospace;
  }

  /* Actions */
  .actions {
    display: flex; gap: 10px; margin-top: 12px;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 52px; padding: 0 20px; border-radius: 12px;
    font-size: 16px; font-weight: 700; font-family: inherit;
    cursor: pointer; transition: all .15s;
    border: none; flex: 1; letter-spacing: -0.01em;
  }
  .btn-primary {
    background: var(--navy); color: var(--white);
  }
  .btn-primary:hover:not(:disabled) { background: #0F1D38; }
  .btn-primary:disabled {
    background: var(--border); color: var(--text-muted); cursor: not-allowed;
  }
  .btn-secondary {
    background: var(--white); color: var(--navy);
    border: 2px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--navy); }
  .btn-teal {
    background: var(--teal); color: var(--white);
  }
  .btn-teal:hover { background: var(--teal-dark); }
  .btn-ghost {
    background: transparent; color: var(--text-secondary);
    border: none; text-decoration: underline; height: 36px;
  }

  /* Insight break overlay */
  .ib {
    position: fixed; inset: 0; z-index: 200;
    background: var(--gradient-soft);
    overflow-y: auto; animation: ibFadeIn .4s ease;
  }
  .ib-dark {
    background: var(--gradient-premium); color: var(--white);
  }
  .ib-inner {
    max-width: 640px; margin: 0 auto; padding: 60px 24px 48px;
    min-height: 100vh; display: flex; flex-direction: column;
    justify-content: center;
  }
  .ib-label {
    font-size: 12px; font-weight: 700; letter-spacing: 0.15em;
    color: var(--teal); margin-bottom: 20px; text-transform: uppercase;
  }
  .ib-dark .ib-label { color: #7FE3B9; }
  .ib-title {
    font-size: 22px; font-weight: 700; color: var(--navy);
    margin: 0 0 24px; line-height: 1.35;
  }
  .ib-dark .ib-title { color: var(--white); }
  .ib-keyword {
    font-size: 56px; font-weight: 800; color: var(--teal);
    text-align: center; margin: 24px 0; letter-spacing: -0.03em;
    line-height: 1;
  }
  .ib-body {
    font-size: 16px; color: var(--text-secondary);
    line-height: 1.65; margin-bottom: 32px;
  }
  .ib-dark .ib-body { color: rgba(255,255,255,.85); }
  .ib-body strong, .ib-body em {
    color: var(--navy); font-weight: 700; font-style: normal;
  }
  .ib-dark .ib-body strong, .ib-dark .ib-body em { color: #7FE3B9; }
  .ib-actions { margin-top: 24px; }

  /* Match cards (IB2) */
  .match-cards {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin: 16px 0 24px;
  }
  .match-card {
    background: var(--white); padding: 20px 16px;
    border-radius: 12px; text-align: center;
    border: 2px solid var(--border);
  }
  .match-card .label {
    font-size: 11px; color: var(--text-muted);
    font-weight: 600; margin-bottom: 8px;
  }
  .match-card .area {
    font-size: 18px; font-weight: 700; color: var(--navy);
  }
  .match-link {
    text-align: center; font-size: 14px; font-weight: 600;
    padding: 10px; border-radius: 10px; margin-bottom: 16px;
  }
  .match-link.match {
    background: #F0FDF4; color: var(--success);
  }
  .match-link.mismatch {
    background: #FEF3C7; color: #B45309;
  }

  /* IB3 chart block */
  .radar-wrap {
    background: var(--white); border-radius: 14px;
    padding: 18px 14px; margin-bottom: 20px;
    border: 1px solid var(--border);
  }
  .radar-canvas { max-width: 100%; }

  .summary-block {
    background: var(--white); border-radius: 14px;
    padding: 20px; margin-bottom: 16px;
    border: 1px solid var(--border);
  }
  .summary-block .h {
    font-size: 12px; font-weight: 700; color: var(--teal);
    letter-spacing: 0.05em; margin-bottom: 8px;
  }
  .summary-block .t {
    font-size: 18px; font-weight: 700; color: var(--navy);
    margin-bottom: 4px;
  }
  .summary-block .d {
    font-size: 14px; color: var(--text-secondary);
  }

  /* Profile summary card (IB3) */
  .profile-summary {
    background: var(--white); border-radius: 16px;
    padding: 20px 22px; margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(27,42,74,.06);
  }
  .profile-summary .ps-title {
    font-size: 12px; font-weight: 700;
    color: var(--text-muted); letter-spacing: 0.08em;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .profile-summary .ps-item {
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .profile-summary .ps-item:last-of-type { border-bottom: none; padding-bottom: 4px; }
  .profile-summary .ps-axis {
    font-size: 12px; font-weight: 700;
    letter-spacing: 0.03em;
  }
  .profile-summary .ps-axis.high { color: var(--teal); }
  .profile-summary .ps-axis.low  { color: var(--navy); }
  .profile-summary .ps-text {
    font-size: 15px; color: var(--text-primary);
    font-weight: 500; line-height: 1.45;
  }
  .profile-summary .ps-neutral {
    font-size: 14px; color: var(--text-secondary);
    margin: 0; line-height: 1.55;
  }

  /* Save fallback page (mobile new tab) — body styles applied via inline doc */

  /* Phase 1 complete */
  .complete {
    text-align: center; padding: 48px 16px;
  }
  .complete .checkmark {
    width: 72px; height: 72px; border-radius: 50%;
    background: var(--teal); color: var(--white);
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin: 0 auto 20px;
  }

  /* Animations */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes ibFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Small helpers */
  .muted { color: var(--text-muted); font-size: 13px; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .qnumber { color: var(--text-muted); font-weight: 600; }

  @media (max-width: 400px) {
    .qtext { font-size: 17px; }
    .ib-keyword { font-size: 44px; }
    .ib-title { font-size: 19px; }
  }
</style>
</head>

<body>
  <div id="progress-wrap" class="hidden"><div id="progress-bar"></div></div>
  <main id="app"></main>

<script>
/* =========================================================
   100일 나침반 진단 — Phase 1
   ========================================================= */

/* ---------- 0. 상수 ---------- */
const AREA_LABELS = {
  health:       "건강 · 체력",
  finance:      "경제적 자유",
  growth:       "성장 · 학습",
  relationship: "관계 · 가정",
  contribution: "기여 · 영향력",
  lifestyle:    "삶의 방식"
};

const IB1_KEYWORDS = {
  health: "건강",
  finance: "자유",
  growth: "성장",
  relationship: "가족",
  contribution: "영향력",
  lifestyle: "도전"
};

const AXIS_LABELS = {
  axis1: "변화 방향",
  axis2: "변화 대상",
  axis3: "동기 원천",
  axis4: "성취 형태",
  axis5: "관계 지향",
  axis6: "도전 성향",
  axis7: "시간 감각",
  axis8: "영역 선호"
};

const AXIS_POLES = {
  axis1: ["없애기", "더하기"],
  axis2: ["나 자신", "환경"],
  axis3: ["회피", "기대"],
  axis4: ["외적 결과", "내면 변화"],
  axis5: ["나 중심", "관계 중심"],
  axis6: ["숙련 확장", "새로운 도전"],
  axis7: ["단기 집중", "장기 여정"],
  axis8: ["분산", "집중"]
};

// IB3 프로필 요약 해석 문구 (low: ≤2.0, high: ≥3.5)
const AXIS_INTERPRETATIONS = {
  axis1: { name: "변화 방향", low: "현재 고통을 해결하고 싶다",     high: "새로운 이상을 추구한다" },
  axis2: { name: "변화 대상", low: "나 자신을 바꾸려 한다",         high: "환경을 바꾸려 한다" },
  axis3: { name: "동기 원천", low: "후회를 피하려는 힘이 크다",     high: "행복을 향해 나아가려 한다" },
  axis4: { name: "성취 형태", low: "눈에 보이는 결과를 원한다",     high: "내면의 깊은 변화를 원한다" },
  axis5: { name: "관계 지향", low: "나를 위한 목표",                high: "소중한 사람들을 위한 목표" },
  axis6: { name: "도전 성향", low: "잘하는 것을 더 잘하고 싶다",     high: "완전히 새로운 도전을 원한다" },
  axis7: { name: "시간 감각", low: "단기간 확실한 성과를 원한다",   high: "장기적 여정의 시작으로 본다" },
  axis8: { name: "영역 집중", low: "관심이 여러 영역에 흩어져 있다", high: null /* 동적: "{영역}에 가장 큰 관심" */ }
};

/* ---------- 1. 질문 데이터 ---------- */
const QUESTIONS = {
  phase1: {
    partA: [
      { id: "Q1", type: "single", part: "A",
        text: "일요일 아침, 특별한 약속이 없습니다. 눈을 떴을 때 가장 먼저 하고 싶은 것은?",
        options: [
          { label: "(A) 운동복으로 갈아입고 밖으로 나간다", value: "A", tags: { axis8: "health" } },
          { label: "(B) 밀려있던 책이나 영상 강의를 본다", value: "B", tags: { axis8: "growth" } },
          { label: "(C) 가족이나 소중한 사람에게 연락한다", value: "C", tags: { axis8: "relationship" } },
          { label: "(D) 가보고 싶었던 카페나 장소를 찾아간다", value: "D", tags: { axis8: "lifestyle" } },
          { label: "(E) 노트를 펼치고 미뤄왔던 아이디어를 정리한다", value: "E", tags: { axis8: "contribution" } },
          { label: "(F) 아무것도 하지 않고 조용히 쉰다 — 그것만으로도 충분하다", value: "F", tags: { axis8: "undecided" } }
        ]
      },
      { id: "Q2", type: "single", part: "A",
        text: "평일 퇴근 후, 예상치 못한 2시간의 여유가 생겼습니다. 당신은?",
        options: [
          { label: "(A) 몸을 움직이며 땀을 흘리고 싶다", value: "A", tags: { axis8: "health" } },
          { label: "(B) 조용히 앉아 무언가를 배우거나 읽고 싶다", value: "B", tags: { axis8: "growth" } },
          { label: "(C) 오랫동안 무시했던 중요한 사람에게 연락하고 싶다", value: "C", tags: { axis8: "relationship" } },
          { label: "(D) 평소 관심 있던 분야의 정보를 파고들고 싶다", value: "D", tags: { axis8: "finance" } },
          { label: "(E) 머릿속에 그려왔던 계획을 실행에 옮기고 싶다", value: "E", tags: { axis8: "contribution" } },
          { label: "(F) 특별히 하고 싶은 것 없이 편하게 보낸다", value: "F", tags: { axis8: "undecided" } }
        ]
      },
      { id: "Q3", type: "single", part: "A",
        text: "“1년간 생활비가 보장된다면” 가장 먼저 시작하고 싶은 것은?",
        options: [
          { label: "(A) 매일 새벽 5시에 일어나는 규칙적인 생활을 시작한다", value: "A", tags: { axis8: "health" } },
          { label: "(B) 1년간 한 분야를 깊이 파고들어 전문가가 된다", value: "B", tags: { axis8: "growth" } },
          { label: "(C) 세상에 나만의 결과물을 하나 남긴다", value: "C", tags: { axis8: "contribution" } },
          { label: "(D) 소중한 사람들과 잊지 못할 경험을 만든다", value: "D", tags: { axis8: "relationship" } },
          { label: "(E) 지금과 완전히 다른 환경에서 살아본다", value: "E", tags: { axis8: "lifestyle" } }
        ]
      },
      { id: "Q4", type: "single", part: "A",
        text: "“실패가 절대 불가능하다면” 지금 당장 도전하고 싶은 것은?",
        options: [
          { label: "(A) 인생 최고의 체력과 건강을 만든다", value: "A", tags: { axis8: "health" } },
          { label: "(B) 경제적으로 완전히 자유로운 삶을 이룬다", value: "B", tags: { axis8: "finance" } },
          { label: "(C) 수만 명이 나의 이야기를 듣는 인플루언서가 된다", value: "C", tags: { axis8: "contribution" } },
          { label: "(D) 나만의 사업을 만들어 세상에 가치를 준다", value: "D", tags: { axis8: "contribution" } },
          { label: "(E) 완전히 새로운 분야에서 전문가가 된다", value: "E", tags: { axis8: "growth" } },
          { label: "(F) 사랑하는 사람들에게 최고의 환경을 만들어준다", value: "F", tags: { axis8: "relationship" } }
        ]
      },
      { id: "Q5", type: "single", part: "A",

/* ---------- 3. 진행 순서 (Phase 1) ---------- */
function buildPhase1Order(answers) {
  const order = [];

  // Part A (조건부 Q10-1 포함)
  QUESTIONS.phase1.partA.forEach(q => {
    if (q.id === "Q10-1") {
      if (answers?.Q10?.value === "A") order.push({ ...q, part: "A" });
    } else {
      order.push({ ...q, part: "A" });
    }
  });

  // Part B2
  QUESTIONS.phase1.partB2.forEach(q => order.push({ ...q, part: "B2" }));

  // Part B1
  QUESTIONS.phase1.partB1.forEach(q => order.push({ ...q, part: "B1" }));

  // Part C
  QUESTIONS.phase1.partC.forEach(q => order.push({ ...q, part: "C" }));

  return order;
}

function getPhase1TotalCount() {
  let n = 12 + 25 + 1 + 5 + 5; // partA(12) + partB2(25) + MC1 + partB1(5) + partC(5)
  if (STATE.answers?.Q10?.value === "A") n += 1; // Q10-1
  return n;
}

function save(key, data) {

}
function load(key) {
  try { return JSON.parse(localStorage.getItem(key) || "null"); } catch(e) { return null; }

function average(arr) {
  const nums = arr.filter(v => typeof v === "number" && !Number.isNaN(v));
  if (!nums.length) return 3;
  return nums.reduce((a,b) => a+b, 0) / nums.length;
}

function gaEvent(name, params = {}) {
  try { gtag('event', name, params); } catch(e) {}
}

  const bar = $('#progress-bar');

  if (pct === null || pct === undefined) {
    wrap.classList.add('hidden');

  }
  wrap.classList.remove('hidden');
  bar.style.width = Math.max(0, Math.min(100, pct)) + '%';

/* ---------- 5. 점수 산출 엔진 ---------- */

// 영역 카운트 (axis 8 기반 영역 선호)
function calculateAreaCounts(answers, qIds) {
  const counts = { health:0, finance:0, growth:0, relationship:0, contribution:0, lifestyle:0 };
  qIds.forEach(id => {
    const ans = answers[id];
    if (!ans?.tags) return;
    const area = ans.tags.axis8;
    if (area && counts.hasOwnProperty(area)) counts[area]++;
  });
  return counts;
}

function getTopArea(answers, qIds) {
  const counts = calculateAreaCounts(answers, qIds);
  const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  if (!sorted.length || sorted[0][1] === 0) return null;
  return sorted[0][0];
}

// 8축 점수 (각 1~5)
function calculateAxisScores(answers) {
  const axes = {};
  const sv = (id) => answers[id]?.sliderValue;
  const forced = (id, forA, forB) => {
    const v = answers[id]?.value;
    if (v === 'A') return forA;
    if (v === 'B') return forB;
    return null;
  };

  // 축 1: 변화 방향 — Q13 slider + Q14 forced + Q15 slider
  axes.axis1 = average([ sv('Q13'), forced('Q14',1,5), sv('Q15') ]);

  // 축 2: 변화 대상 — Q30 slider + Q31 forced + Q32 forced
  axes.axis2 = average([ sv('Q30'), forced('Q31',1,5), forced('Q32',1,5) ]);

  // 축 3: 동기 원천 — Q16 slider + Q17 forced + Q18 forced
  axes.axis3 = average([ sv('Q16'), forced('Q17',1,5), forced('Q18',1,5) ]);

  // 축 4: 성취 형태 — Q19 slider + Q20 forced + Q21 slider
  axes.axis4 = average([ sv('Q19'), forced('Q20',1,5), sv('Q21') ]);

  // 축 5: 관계 지향 — Q8 slider + Q9 forced + Q33 slider + Q34 forced + Q35 direct
  const q35map = { A:5, B:3, C:1, D:5 };
  const q35v = q35map[answers.Q35?.value];
  axes.axis5 = average([ sv('Q8'), forced('Q9',1,5), sv('Q33'), forced('Q34',1,5), q35v ]);

  // 축 6: 도전 성향 — Q22 slider + Q23 forced + Q24 slider
  axes.axis6 = average([ sv('Q22'), forced('Q23',1,5), sv('Q24') ]);

  // 축 7: 시간 감각 — Q12 slider + Q25 slider + Q26 forced + Q27 forced
  axes.axis7 = average([ sv('Q12'), sv('Q25'), forced('Q26',1,5), forced('Q27',1,5) ]);

  // 축 8: 영역 선호 — Q1~Q7 + QB1~QB5 상위 영역 집중도 (1~5)
  const counts = calculateAreaCounts(answers, ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','QB1','QB2','QB3','QB4','QB5']);
  const vals = Object.values(counts);
  const total = vals.reduce((a,b)=>a+b,0) || 1;
  const top = Math.max(...vals);
  axes.axis8 = 1 + (top / total) * 4; // 분산(1.xx) ~ 집중(5)

  return axes;
}

// C형 수용도: Q11 + Q24 + Q29
function calculateCTypeAcceptance(answers) {
  const q11Acc = { A:4, B:3, C:2, D:1 };
  const q11v   = q11Acc[answers.Q11?.value] ?? 2.5;
  const q24v   = answers.Q24?.sliderValue ?? 3;
  const q29v   = answers.Q29?.value === 'A' ? 1 : (answers.Q29?.value === 'B' ? 5 : 3);
  const score  = (q11v + q24v + q29v) / 3;
  let level;
  if (score >= 4.0) level = "높음";
  else if (score >= 2.5) level = "보통";
  else level = "탐색 중";
  return { score, level };
}

/* ---------- 6. 토너먼트 ---------- */
function generateTournament(answers) {
  const counts = calculateAreaCounts(answers, ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','QB1','QB2','QB3','QB4','QB5']);
  const all = Object.entries(counts).sort((a,b) => b[1] - a[1]);
  // 상위 4개 (count 0이어도 포함해서 4자리 채움)
  const top4 = all.slice(0, 4).map(e => e[0]);
  return {
    semi1: { a: top4[0], b: top4[1] },
    semi2: { a: top4[2], b: top4[3] },
    winners: {}
  };
}

function resumeFromAnswers() {
  // 가장 마지막 답변된 문항 다음으로 이동
  const order = buildPhase1Order(STATE.answers);
  let resumeIdx = order.length;
  for (let i = 0; i < order.length; i++) {
    if (!STATE.answers[order[i].id]) { resumeIdx = i; break; }
  }
  if (resumeIdx >= order.length) {
    // 다 했으면 Phase 1 complete로
    showPhase1Complete();
    return;
  }
  const q = order[resumeIdx];
  STATE.currentPart = q.part;
  const partOrder = order.filter(x => x.part === q.part);
  STATE.currentIndex = partOrder.findIndex(x => x.id === q.id);
  renderCurrentQuestion();
}

/* ---------- 8. 렌더링: 질문 ---------- */
function renderCurrentQuestion() {
  STATE.currentScreen = 'question';
  const order = buildPhase1Order(STATE.answers);

  // 현재 파트 내 위치 찾기
  const partQs = order.filter(q => q.part === STATE.currentPart);
  const globalIdx = order.findIndex(q => q.id === partQs[STATE.currentIndex].id);
  const total = getPhase1TotalCount();
  const progressPct = (globalIdx / total) * 40; // Phase 1 = 0~40%
  setProgress(progressPct);

  const q = partQs[STATE.currentIndex];
  renderQuestion(q, globalIdx + 1, total);
}

function renderQuestion(q, questionNum, totalNum) {
  const app = $('#app');
  const partMeta = {
    'A':  'Phase 1 · Part A · 제약 해제',
    'B2': 'Phase 1 · Part B · 욕구 심화',
    'B1': 'Phase 1 · Part B · 행동 회상',
    'C':  'Phase 1 · Part C · 우선순위'
  }[q.part] || 'Phase 1';

  let body = '';
  // 질문 메타 + 텍스트
  let qtext = q.text;
  if (q.type === 'tournament') {
    qtext = buildTournamentText(q);
  } else if (q.id === 'Q41') {
    qtext = buildQ41Text();
  }

  body += `
    <div class="qcard" data-qid="${q.id}">
      <div class="qmeta">${partMeta} · <span class="qnumber">${questionNum}/${totalNum}</span></div>
      <div class="qtext ${q.type === 'slider' ? 'small' : ''}">${escapeHtml(qtext)}</div>
  `;

  // 타입별 본문
  if (q.type === 'single' || q.type === 'forced') {
    body += renderOptions(q.options, q.id);
  } else if (q.type === 'slider') {
    body += renderSlider(q);
  } else if (q.type === 'tournament') {
    body += renderTournamentOptions(q);
  }

  body += '</div>';

  // 액션 바
  const canGoBack = questionNum > 1;
  body += `
    <div class="actions">
      ${canGoBack ? `<button class="btn btn-secondary" id="prev-btn">이전</button>` : ''}
      <button class="btn btn-primary" id="next-btn" disabled>다음</button>
    </div>
  `;

  app.innerHTML = body;

  // 이벤트 바인딩
  if (q.type === 'single' || q.type === 'forced' || q.type === 'tournament') {
    app.querySelectorAll('.opt').forEach(b => {
      b.addEventListener('click', () => {
        app.querySelectorAll('.opt').forEach(x => x.classList.remove('selected'));
        b.classList.add('selected');
        $('#next-btn').disabled = false;
        // 저장은 next 누를 때
        b.dataset.picked = '1';
      });
    });
  } else if (q.type === 'slider') {
    const slider = $('#slider');
    const out = $('#slider-val');
    const update = () => {
      const v = parseInt(slider.value, 10);
      out.textContent = v;
      slider.style.setProperty('--pct', ((v-1) / 4 * 100) + '%');
      $('#next-btn').disabled = false;
    };
    slider.addEventListener('input', update);
    update();
  }

  if (canGoBack) {
    $('#prev-btn').addEventListener('click', goPrev);
  }
  $('#next-btn').addEventListener('click', () => saveAndAdvance(q));

  // 이전 답변이 있으면 복원
  restoreAnswer(q);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(s) {
  if (!s) return '';
  return String(s).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderOptions(options, qid) {
  let html = '<div class="opts">';
  options.forEach((o, i) => {
    html += `<button class="opt" data-idx="${i}" type="button">${escapeHtml(o.label)}</button>`;
  });
  html += '</div>';
  return html;
}

function restoreAnswer(q) {
  const prev = STATE.answers[q.id];
  if (!prev) return;
  if (q.type === 'slider' && typeof prev.sliderValue === 'number') {
    const slider = $('#slider');
    slider.value = prev.sliderValue;
    slider.dispatchEvent(new Event('input'));
  } else if (prev.value) {
    const buttons = document.querySelectorAll('.opt');
    buttons.forEach(b => {
      if (b.textContent.trim().startsWith(`(${prev.value})`)) {
        b.classList.add('selected');
        b.dataset.picked = '1';
      }
    });
    const nb = $('#next-btn'); if (nb) nb.disabled = false;
  }
}

/* ---------- 9. 응답 저장 + 이동 ---------- */
function saveAndAdvance(q) {
  const app = $('#app');
  let ans = null;

  if (q.type === 'slider') {
    const v = parseInt($('#slider').value, 10);
    ans = { sliderValue: v };
  } else {
    const picked = app.querySelector('.opt.selected');
    if (!picked) return;
    const idx = parseInt(picked.dataset.idx, 10);
    const options = q.type === 'tournament' ? q._dynamicOptions : q.options;
    const opt = options[idx];
    ans = {
      value: opt.value,
      label: opt.label,
      tags: opt.tags || {},
      axisScore: opt.axisScore || null
    };
  }
  STATE.answers[q.id] = ans;

  // 토너먼트 승자 기록
  if (q.type === 'tournament') {
    const pickedArea = ans.tags?.tournament_choice;
    if (q.round === 'semi1') STATE.tournament.winners.semi1 = pickedArea;
    if (q.round === 'semi2') STATE.tournament.winners.semi2 = pickedArea;
    if (q.round === 'final') STATE.tournament.winners.final = pickedArea;
  }

  // Phase 1 진행 상태 저장
  save('compass_phase1', {
    answers: STATE.answers,
    tournament: STATE.tournament,
    updatedAt: Date.now()
  });

  // 다음 스텝
  goNext(q);
}

function goNext(currentQ) {
  const order = buildPhase1Order(STATE.answers);
  const partQs = order.filter(q => q.part === STATE.currentPart);
  const nextIndex = STATE.currentIndex + 1;

  // Part 내 다음 문항
  if (nextIndex < partQs.length) {
    STATE.currentIndex = nextIndex;
    renderCurrentQuestion();
    return;
  }

  // Part 경계 → 인사이트 브레이크 or 다음 Part
  if (STATE.currentPart === 'A') {
    return renderIB1();
  }
  if (STATE.currentPart === 'B2') {
    // B2 → B1 (IB 없음, 단 안내 메시지)
    STATE.currentPart = 'B1';
    STATE.currentIndex = 0;
    return renderCurrentQuestion();
  }
  if (STATE.currentPart === 'B1') {
    return renderIB2();
  }
  if (STATE.currentPart === 'C') {
    return renderIB3();
  }
}

function goPrev() {
  const order = buildPhase1Order(STATE.answers);
  const partQs = order.filter(q => q.part === STATE.currentPart);

  if (STATE.currentIndex > 0) {
    STATE.currentIndex -= 1;
    return renderCurrentQuestion();
  }

  // Part 경계 뒤로
  const partOrder = ['A','B2','B1','C'];
  const curIdx = partOrder.indexOf(STATE.currentPart);
  if (curIdx > 0) {
    const prevPart = partOrder[curIdx - 1];
    STATE.currentPart = prevPart;
    const prevPartQs = buildPhase1Order(STATE.answers).filter(q => q.part === prevPart);
    STATE.currentIndex = prevPartQs.length - 1;
    return renderCurrentQuestion();
  }
}

function renderInsightBreakShell({ number, label, title, contentHtml, ctaText, onContinue, dark = false, saveBtn = false }) {

function isMobileDevice() {
  return /iPhone|iPad|iPod|Android|Mobile/i.test(navigator.userAgent);
}

async function saveIBImage(el) {
  const target = el.querySelector('.ib-inner');
  if (!window.html2canvas || !target) return;

  const filename = `나침반_Phase1_${(STATE.participantName||'나의결과').replace(/\s+/g,'_')}_${Date.now()}.png`;
  const btn = el.querySelector('#ib-save-btn');
  if (btn) { btn.disabled = true; btn.textContent = '이미지 생성 중…'; }

  try {
    const canvas = await html2canvas(target, { backgroundColor: '#ffffff', scale: 2, useCORS: true });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png', 0.95));
    if (!blob) throw new Error('blob conversion failed');

    const file = new File([blob], filename, { type: 'image/png' });
    const canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [file] }));

    // 1) Web Share API (파일 공유 가능한 경우 — iOS Safari 14.5+ / Android Chrome 등)
    if (canShareFiles && navigator.share) {
      try {
        await navigator.share({
          files: [file],
          title: '100일 나침반 진단 결과',
          text: `${STATE.participantName || '나'}의 갈망 프로필`
        });
        gaEvent('compass_save_result', { format: 'share_files', phase: 1 });
        return;
      } catch (err) {
        // 사용자 취소(AbortError)는 그냥 종료
        if (err && err.name === 'AbortError') return;
        // 그 외 실패 시 다음 단계로 fallthrough
      }
    }

    // 2) 모바일 + Web Share 미지원 → 새 창에 이미지 + 길게 눌러 저장 안내
    if (isMobileDevice()) {
      const url = URL.createObjectURL(blob);
      const w = window.open('', '_blank');
      if (!w) {
        alert('새 창이 차단되었습니다. 브라우저 팝업 허용 후 다시 시도해주세요.');
        return;
      }
      w.document.open();
      w.document.write(
        '<!doctype html><html lang="ko"><head>' +
        '<meta charset="utf-8">' +
        '<meta name="viewport" content="width=device-width, initial-scale=1">' +
        '<title>나침반 결과</title>' +
        '<style>' +
          'body{margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Pretendard Variable","Apple SD Gothic Neo",sans-serif;background:#F8F9FA;color:#1B2A4A;text-align:center;}' +
          '.msg{padding:14px 16px;font-size:15px;background:#1A8F6A;color:#fff;font-weight:700;line-height:1.5;}' +
          '.sub{padding:10px 16px;font-size:13px;color:#5A6B7D;background:#fff;}' +
          'img{width:100%;display:block;}' +
        '</style></head><body>' +
        '<div class="msg">이미지를 <strong>길게 눌러</strong> "사진에 저장" 또는 "이미지 다운로드"를 선택해주세요</div>' +
        '<div class="sub">저장 후 이 창은 닫으셔도 됩니다.</div>' +
        '<img src="' + url + '" alt="나침반 결과" />' +
        '</body></html>'
      );
      w.document.close();
      gaEvent('compass_save_result', { format: 'newtab_longpress', phase: 1 });
      return;
    }

    // 3) 데스크톱 → 기존 다운로드
    const link = document.createElement('a');
    link.download = filename;
    link.href = URL.createObjectURL(blob);
    document.body.appendChild(link);
    link.click();
    setTimeout(() => {
      URL.revokeObjectURL(link.href);
      link.remove();
    }, 1000);
    gaEvent('compass_save_result', { format: 'download', phase: 1 });
  } catch (err) {
    console.error('saveIBImage error:', err);
    alert('결과 저장 중 문제가 발생했습니다. 다시 시도해주세요.');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '결과 저장하기'; }
  }
}

function drawRadar(canvasId, axes) {

  const data = [
    axes.axis1, axes.axis2, axes.axis3, axes.axis4,
    axes.axis5, axes.axis6, axes.axis7, axes.axis8
  ].map(v => Number.isFinite(v) ? +v.toFixed(2) : 3);

  new Chart(el, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: '갈망 프로필',
        data,
        backgroundColor: 'rgba(26,143,106,0.18)',
        borderColor: '#1A8F6A',
        pointBackgroundColor: '#1B2A4A',
        pointBorderColor: '#FFFFFF',
        pointRadius: 4,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.label}: ${ctx.formattedValue}`
          }
        }
      },
      scales: {
        r: {
          min: 0, max: 5,
          ticks: { stepSize: 1, color: '#8E9BAA', font: { size: 10 }, backdropColor: 'transparent' },
          angleLines: { color: '#E2E8F0' },
          grid: { color: '#E2E8F0' },
          pointLabels: { color: '#1B2A4A', font: { size: 12, weight: '600' } }
        }
      }
    }
  });
}

/* IB3 프로필 요약: 상위 2 + 하위 1 */
function buildProfileSummary(axes, answers) {
  const HIGH = 3.5, LOW = 2.0;
  const candidates = [];
  for (let i = 1; i <= 8; i++) {
    const k = `axis${i}`;
    candidates.push({ key: k, score: axes[k], name: AXIS_INTERPRETATIONS[k].name });
  }
  const high = candidates.filter(a => a.score >= HIGH).sort((a,b) => b.score - a.score).slice(0, 2);
  const low  = candidates.filter(a => a.score <= LOW ).sort((a,b) => a.score - b.score).slice(0, 1);

  if (!high.length && !low.length) return { neutral: true, items: [] };

  const items = [];
  high.forEach(a => {
    let text;
    if (a.key === 'axis8') {
      const top = getTopArea(answers, ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','QB1','QB2','QB3','QB4','QB5']);
      text = `${AREA_LABELS[top] || '특정 영역'}에 가장 큰 관심`;
    } else {
      text = AXIS_INTERPRETATIONS[a.key].high;
    }
    items.push({ direction: 'high', name: a.name, text });
  });
  low.forEach(a => {
    items.push({
      direction: 'low',
      name: a.name,
      text: AXIS_INTERPRETATIONS[a.key].low
    });
  });
  return { neutral: false, items };
}

function renderProfileSummary(axes, answers) {
  const summary = buildProfileSummary(axes, answers);
  if (summary.neutral) {
    return `
      <div class="profile-summary">
        <div class="ps-title">당신의 프로필 요약</div>
        <p class="ps-neutral">아직 방향을 탐색 중입니다 — Phase 2에서 더 선명해집니다.</p>
      </div>
    `;
  }
  const itemsHtml = summary.items.map(it => {
    const icon = it.direction === 'high' ? '▲' : '▼';
    return `
      <div class="ps-item">
        <span class="ps-axis ${it.direction}">${icon} ${escapeHtml(it.name)}</span>
        <span class="ps-text">${escapeHtml(it.text)}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="profile-summary">
      <div class="ps-title">당신의 프로필 요약</div>
      ${itemsHtml}
    </div>
  `;
}

}
