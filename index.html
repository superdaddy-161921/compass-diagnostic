function drawRadar(canvasId, axes) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  const labels = ['변화 방향', '변화 대상', '동기 원천', '성취 형태', '관계 지향', '도전 성향', '시간 감각', '영역 집중'];
  const data = [
    axes.axis1, axes.axis2, axes.axis3, axes.axis4,
    axes.axis5, axes.axis6, axes.axis7, axes.axis8
  ].map(v => Number.isFinite(v) ? +v.toFixed(2) : 3);

  new Chart(el, {
    type: 'radar',
    data: {
      labels,
      datasets: [{
        label: '갈망 프로필',
        data,
        backgroundColor: 'rgba(26,143,106,0.18)',
        borderColor: '#1A8F6A',
        pointBackgroundColor: '#1B2A4A',
        pointBorderColor: '#FFFFFF',
        pointRadius: 4,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.label}: ${ctx.formattedValue}`
          }
        }
      },
      scales: {
        r: {
          min: 0, max: 5,
          ticks: { stepSize: 1, color: '#8E9BAA', font: { size: 10 }, backdropColor: 'transparent' },
          angleLines: { color: '#E2E8F0' },
          grid: { color: '#E2E8F0' },
          pointLabels: { color: '#1B2A4A', font: { size: 12, weight: '600' } }
        }
      }
    }
  });
}

/* IB3 프로필 요약: 상위 2 + 하위 1 */
function buildProfileSummary(axes, answers) {
  const HIGH = 3.5, LOW = 2.0;
  const candidates = [];
  for (let i = 1; i <= 8; i++) {
    const k = `axis${i}`;
    candidates.push({ key: k, score: axes[k], name: AXIS_INTERPRETATIONS[k].name });
  }
  const high = candidates.filter(a => a.score >= HIGH).sort((a,b) => b.score - a.score).slice(0, 2);
  const low  = candidates.filter(a => a.score <= LOW ).sort((a,b) => a.score - b.score).slice(0, 1);

  if (!high.length && !low.length) return { neutral: true, items: [] };

  const items = [];
  high.forEach(a => {
    let text;
    if (a.key === 'axis8') {
      const top = getTopArea(answers, ['Q1','Q2','Q3','Q4','Q5','Q6','Q7','QB1','QB2','QB3','QB4','QB5']);
      text = `${AREA_LABELS[top] || '특정 영역'}에 가장 큰 관심이 향해 있습니다`;
    } else {
      text = AXIS_INTERPRETATIONS[a.key].high;
    }
    items.push({ direction: 'high', name: a.name, text });
  });
  low.forEach(a => {
    items.push({
      direction: 'low',
      name: a.name,
      text: AXIS_INTERPRETATIONS[a.key].low
    });
  });
  return { neutral: false, items };
}

function renderProfileSummary(axes, answers) {
  const summary = buildProfileSummary(axes, answers);
  if (summary.neutral) {
    return `
      <div class="profile-summary">
        <div class="ps-title">당신의 프로필 요약</div>
        <p class="ps-neutral">여러 방향이 균형 있게 자리잡고 있습니다 — Phase 2에서 우선순위가 보입니다.</p>
      </div>
    `;
  }
  const itemsHtml = summary.items.map(it => {
    const icon = it.direction === 'high' ? '▲' : '▼';
    return `
      <div class="ps-item">
        <span class="ps-axis ${it.direction}">${icon} ${escapeHtml(it.name)}</span>
        <span class="ps-text">${escapeHtml(it.text)}</span>
      </div>
    `;
  }).join('');
  return `
    <div class="profile-summary">
      <div class="ps-title">당신의 프로필 요약</div>
      <p class="ps-legend">
        <strong>▲</strong> 강한 신호 (4.0 이상) · <strong>▼</strong> 약한 신호 (2.0 이하)<br/>
        당신의 답변이 이 방향으로 명확히 기울어진 축입니다.
      </p>
      ${itemsHtml}
    </div>
  `;
}

/* IB#5 — Part F 종료 후 일치도 미터 + 정렬/안심 메시지 (Phase 2 · 2/3) */
function renderIBPostPartF() {

  const thresholdMsg = aligned

    ctaText: "Part E로 — 마지막 단계",

         <div class="t">당신은 <strong>${escapeHtml(e9label)}</strong>이 됩니다.</div>
         ${e10label ? `<div class="d" style="margin-top:6px;">지금과의 차이 — ${escapeHtml(e10label)}</div>` : ''}

    <div class="consistency-meter" style="margin-top:16px;">
      <div class="meter-track">
        <span class="meter-thresh-mark"></span>
        <div class="meter-fill" id="passion-fill-bar" style="width:0%;"></div>
      </div>
      <div class="meter-meta">
        <span class="meter-label">간절함</span>
        <span class="meter-value">${passion.percentage}<span style="font-size:14px;color:var(--text-muted);font-weight:600;">%</span></span>
      </div>
    </div>
  `;

  const passionMsgHtml = `<p class="ib-body" style="margin-top:18px;">${escapeHtml(passionMsg)}</p>`;

  // E12 메타 응답 보조 메시지
  const e12msgHtml = e12key && E12_FOLLOWUPS[e12key]
    ? `<p class="ib-body" style="margin-top:12px;font-size:14px;color:var(--text-secondary);">${escapeHtml(E12_FOLLOWUPS[e12key])}</p>`
    : '';

  // extra_explore ≥ 2
  const extraMsgHtml = extraE >= 2
    ? `<div class="extra-explore-note">일부 답변에 더 살펴볼 신호가 있습니다 (<strong>${extraE}개 영역</strong>). OT에서 더 깊이 다룹니다.</div>`
    : '';

  const verifyMsgMap = {
    different: '사용자 직접 수정 영역 있음 — OT에서 진짜 1위 영역을 함께 정합니다.',
    adjusted:  '재검토 필요 — OT에서 1위 영역을 다듬습니다.',
    unsure:    '아직 모르겠다는 솔직한 답입니다 — OT에서 함께 찾아갑니다.'
  };
  const verifyHtml = (f13verify && verifyMsgMap[f13verify])
    ? `<div class="extra-explore-note" style="background:#FFF7E6;border-left-color:var(--gold);">
         <strong>갈망 영역 사용자 검증:</strong> ${escapeHtml(verifyMsgMap[f13verify])}

    : '';

        </button>
        <button class="branch-opt branch-defer" type="button" data-choice="defer">
          ⏸ OT에서 다시 정하고 싶어요

        </button>
      </div>
    </div>

  // OT 보류 또는 재선택 결과에 따른 보조 안내
  const branchStatusHtml = (() => {
    const br = STATE.answers.IB5_branch;
    if (!br) return '';
    if (br.value === 'defer' || br.defer_to_ot) {
      return `<div class="extra-explore-note" style="background:#FFF7E6;border-left-color:var(--gold);">

              </div>`;
    }
    if (br.value === 'reconsider' && STATE.answers.D20_first) {
      return `<div class="extra-explore-note" style="background:var(--teal-light);border-left-color:var(--teal);color:var(--navy);">

    </p>
  `;

    const fg = extractFinalGoal(STATE.answers);
    const ps = calculatePassionScore(STATE.answers);
    gaEvent('compass_phase_complete', {
      phase: 2,
      passion: ps.percentage,
      passion_level: ps.level,
      final_goal_id: fg.goalId || 'undecided',
      confidence: fg.confidence,
      extra_explore_e: countExtraExplorePartE(STATE.answers),
      ib5_branch: STATE.answers.IB5_branch?.value || 'confirm',
      defer_to_ot: STATE.answers.IB5_branch?.defer_to_ot ? 1 : 0

      route: STATE.route,
      bTypeFlagged: STATE.bTypeFlagged,
      finalGoal: fg,

      identityFocus: STATE.answers.E11?.tags?.identity_focus || null,
      ib5_branch: STATE.answers.IB5_branch?.value || 'confirm',
      defer_to_ot: !!STATE.answers.IB5_branch?.defer_to_ot,
      completedAt: Date.now()
    });

  };

  const overlay = renderInsightBreakShell({
    number: 6,
    label: "Phase 2 · 인사이트 브레이크 3/3",
    title: title,
    contentHtml: html,
    ctaText: "Phase 3 — 100일 실행 계획으로",
    saveBtn: true,
    onContinue: proceedToPhase3
  });

  // PR #9 C1: 분기 옵션 이벤트 바인딩
  if (showBranchBox && overlay) {
    // 분기 박스 표시 중에는 기본 CTA 비활성 + 안내 변경
    const cta = overlay.querySelector('#ib-cta');

    overlay.querySelectorAll('.branch-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        const choice = btn.dataset.choice;
        STATE.answers.IB5_branch = STATE.answers.IB5_branch || {};
        STATE.answers.IB5_branch.value = choice;

          };

          proceedToPhase3();
        }

      if (bar) bar.style.width = passion.percentage + '%';
    }, 200);
  });
}

// 5영역 갭 레이더 차트 — 현재(틸) + 원하는(네이비) 2 데이터셋
function drawGapRadar(canvasId, currentArr, targetArr, labels) {
  const el = document.getElementById(canvasId);
  if (!el || !window.Chart) return;
  new Chart(el, {
    type: 'radar',
    data: {
      labels,
      datasets: [
        {
          label: '현재',
          data: currentArr,
          backgroundColor: 'rgba(26,143,106,0.18)',
          borderColor: '#1A8F6A',
          pointBackgroundColor: '#1A8F6A',
          pointBorderColor: '#FFFFFF',
          pointRadius: 4,
          borderWidth: 2
        },
        {
          label: '100일 후 원하는',
          data: targetArr,
          backgroundColor: 'rgba(27,42,74,0.10)',
          borderColor: '#1B2A4A',
          pointBackgroundColor: '#1B2A4A',
          pointBorderColor: '#FFFFFF',
          pointRadius: 4,
          borderWidth: 2,
          borderDash: [4, 4]
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: { color: '#1B2A4A', font: { size: 12, weight: '600' } }
        },
        tooltip: {
          callbacks: {
            label: (ctx) => `${ctx.dataset.label} · ${ctx.label}: ${ctx.formattedValue}`
          }
        }
      },
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, color: '#8E9BAA', font: { size: 10 }, backdropColor: 'transparent' },
          angleLines: { color: '#E2E8F0' },
          grid: { color: '#E2E8F0' },
          pointLabels: { color: '#1B2A4A', font: { size: 12, weight: '600' } }
        }
      }
    }
  });
}

/* ---------- UUID 헬퍼 ---------- */
function getOrCreateUUID() {
  let uuid;
  try { uuid = localStorage.getItem('compass_uuid'); } catch(e) {}
  if (uuid) return uuid;
  if (window.crypto?.randomUUID) {
    uuid = crypto.randomUUID();
  } else {
    // 폴백: 시간 + 랜덤
    uuid = 'cmp-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  try { localStorage.setItem('compass_uuid', uuid); } catch(e) {}
  gaEvent('compass_uuid_created', { uuid });
  return uuid;
}

      <!-- 8. 100일 각오 (H5) -->

        <div class="ib8-meter">
          <div class="ib8-meter-track"><div class="ib8-meter-fill" style="width:${h5Pct}%;background:var(--gold);"></div></div>

  renderInsightBreakShell({

/* ---------- 관리자 페이지 (?admin=1) ---------- */
function detectFlags(answers) {
  // 🔴 빨강: G11=D (우선순위 재검토 필요) / E14 미응답·고민
  // 🟡 노랑: C형 수용도 낮음, 태도≠행동, extra_explore ≥ 2, F13=B/C/D
  // 🟢 초록: 위 어떤 조건도 안 걸림
  const out = { color: 'green', reasons: [] };

  if (answers?.G11?.tags?.gap_relation === 'reconsider' || answers?.G11?.tags?.flag_reprioritize) {
    out.color = 'red';
    out.reasons.push('G11 우선순위 재검토');
  }
  if (!answers?.E14?.tags?.goal_id) {
    out.color = (out.color === 'red') ? 'red' : 'red';
    out.reasons.push('최종 C형 목표 미확정');
  }

  // 노랑 조건 (이미 빨강이면 추가만)
  const acc = calculateCTypeAcceptance(answers || {});
  if (acc.level === '탐색 중') {
    if (out.color !== 'red') out.color = 'yellow';
    out.reasons.push('C형 수용도 낮음');
  }
  const attitudeTop = getTopArea(answers || {}, ['Q1','Q2','Q3','Q4','Q5','Q6','Q7']);
  const behaviorTop = getTopArea(answers || {}, ['QB1','QB2','QB3','QB4','QB5']);
  if (attitudeTop && behaviorTop && attitudeTop !== behaviorTop) {
    if (out.color !== 'red') out.color = 'yellow';
    out.reasons.push('태도≠행동');
  }
  const extraE = countExtraExplorePartE(answers || {});
  if (extraE >= 2) {
    if (out.color !== 'red') out.color = 'yellow';
    out.reasons.push(`extra_explore ${extraE}개 영역`);
  }
  if (['different','adjusted','unsure'].includes(answers?.F13?.tags?.axis8_verify)) {
    if (out.color !== 'red') out.color = 'yellow';
    out.reasons.push('F13 axis8 사용자 검증 신호');
  }
  // PR #9 C1: IB#5 3/3 분기에서 "OT에서 다시 정하고 싶어요" 선택
  if (answers?.IB5_branch?.defer_to_ot === true || answers?.IB5_branch?.value === 'defer') {
    if (out.color !== 'red') out.color = 'yellow';
    out.reasons.push('IB#5 분기: OT에서 목표 확정 보류');
  }
  return out;
}

function renderAdminPage() {
  STATE.currentScreen = 'admin';
  setProgress(null);
  document.body.style.background = '#F8F9FA';
  const app = $('#app');

  // 같은 기기에 저장된 결과들 수집 (compass_phase1·2·3 + compass_meta + compass_uuid)
  const meta = load('compass_meta') || {};
  const p1 = load('compass_phase1');
  const p2 = load('compass_phase2');
  const p3 = load('compass_phase3');
  const uuid = (() => { try { return localStorage.getItem('compass_uuid') || ''; } catch(e) { return ''; } })();

  const rows = [];
  if (p1 || p2 || p3) {
    const merged = Object.assign({}, p1?.answers || {}, p2?.answers || {}, p3?.answers || {});
    const finalGoal = extractFinalGoal(merged);
    const passion = calculatePassionScore(merged);
    const flag = detectFlags(merged);
    const completedAt = p3?.completedAt || p2?.completedAt || p1?.completedAt || null;
    const route = p3?.route || p2?.route || '-';
    rows.push({
      name: meta.name || '(미입력)',
      uuid,
      route,
      goal: finalGoal.statement || '미확정',
      passion: passion.percentage,
      flag,
      completedAt,
      hasP1: !!p1, hasP2: !!p2, hasP3: !!p3
    });
  }

  const flagDot = (color) => {
    const map = { red:'🔴', yellow:'🟡', green:'🟢' };
    return map[color] || '⚪';
  };

  const fmtDate = (ts) => ts
    ? new Date(ts).toISOString().slice(0, 16).replace('T', ' ')
    : '-';

  const phaseTags = (r) => {
    return [
      `<span class="adm-tag ${r.hasP1?'on':''}">P1</span>`,
      `<span class="adm-tag ${r.hasP2?'on':''}">P2</span>`,
      `<span class="adm-tag ${r.hasP3?'on':''}">P3</span>`
    ].join('');
  };

  app.innerHTML = `
    <div class="admin-page" style="max-width:960px;margin:0 auto;padding:32px 20px;">
      <h1 style="font-size:22px;font-weight:800;color:var(--navy);margin:0 0 8px;">관리자 페이지</h1>
      <p class="muted" style="margin:0 0 18px;">localStorage 기반 — 같은 기기에 저장된 결과만 표시합니다.</p>

      ${rows.length === 0
        ? `<div class="card" style="text-align:center;padding:40px 20px;color:var(--text-muted);">저장된 진단 결과가 없습니다.</div>`
        : `
        <div class="card" style="padding:0;overflow:auto;">
          <table class="admin-table">
            <thead>
              <tr>
                <th>이름</th>
                <th>루트</th>
                <th>C형 목표</th>
                <th>간절함</th>
                <th>플래그</th>
                <th>진행</th>
                <th>완료일</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td><strong>${escapeHtml(r.name)}</strong>${r.uuid ? `<div class="adm-uuid">${escapeHtml(r.uuid)}</div>` : ''}</td>
                  <td>${escapeHtml(r.route)}</td>
                  <td class="adm-goal">${escapeHtml(r.goal)}</td>
                  <td>${r.passion}%</td>
                  <td><span class="adm-flag adm-flag-${r.flag.color}" title="${escapeHtml(r.flag.reasons.join(' · ') || '정상')}">${flagDot(r.flag.color)} ${escapeHtml(r.flag.reasons[0] || '정상')}</span></td>
                  <td>${phaseTags(r)}</td>
                  <td class="adm-date">${escapeHtml(fmtDate(r.completedAt))}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="card" style="margin-top:18px;">
          <h3 style="font-size:14px;color:var(--navy);margin:0 0 8px;">플래그 기준</h3>
          <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--text-secondary);line-height:1.7;">
            <li>🔴 G11=D 또는 최종 C형 목표 미확정 — 우선순위 재검토</li>
            <li>🟡 C형 수용도 낮음 / 태도≠행동 / extra_explore ≥ 2 / F13 axis8 사용자 검증 신호</li>
            <li>🟢 정상 진행</li>
          </ul>
        </div>
      `}

      <div style="margin-top:24px;text-align:center;">
        <a href="${window.location.pathname}" style="font-size:13px;color:var(--text-muted);text-decoration:underline;">← 진단 화면으로</a>
      </div>
    </div>
  `;
}
